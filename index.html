<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style id="theme">
    /* Theme. Every colour, size, spacing, font family, weight, line-height and layout fraction is a token in
       :root; every rule after :root uses var(--token) values and CSS keywords only. Replace this block wholesale.
       1080p reference in brackets. */
    :root {
      --color-scheme: dark;
      --color-background: #0b0b0f;
      --color-text: #f2f2f5;
      --color-label: #a3a3ad;
      --color-slipped: #ff3b3b;
      --color-never: #ff3b3b;
      --color-closer: #2fd66f;
      --color-unchanged: #a3a3ad;
      --color-error: #7a7a86;

      --font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
      --font-numeric: tabular-nums;
      --font-weight-cost: 800;
      --font-weight-key: 700;
      --font-weight-body: 500;
      --font-weight-label: 500;

      --size-cost: min(12vh, 13vw);          /* 129.6 px, the largest element */
      --size-key: min(11.12vh, 12vw);        /* 120.1 px, the five projected goal dates */
      --size-body: min(4.45vh, 5vw);         /* 48.1 px, everything else */

      --line-height-cost: 1;
      --line-height-key: 1;
      --line-height-body: 1.05;
      --weekly-lines: 2;
      --weekly-height: calc(var(--size-body) * var(--line-height-body) * var(--weekly-lines));

      --space-0: 0;
      --board-pad-x: 1.5vw;
      --board-pad-y: 1vh;
      --gap-inline: 1vw;
      --gap-row: 0;
      --layout-full: 100%;
      --layout-viewport-width: 100vw;
      --layout-viewport-height: 100vh;
      --layout-cost-rule-fraction: 1 1 0;
      --layout-grow: 1 1 auto;
      --layout-fixed: 0 0 auto;
      --layout-min-width: 0;
      --layout-goal-columns: minmax(0, 4.3fr) minmax(0, 7.5fr) minmax(0, 2.85fr) minmax(0, 1.6fr) minmax(0, 1.6fr);
    }

    html,
    body {
      margin: var(--space-0);
      padding: var(--space-0);
      width: var(--layout-viewport-width);
      height: var(--layout-viewport-height);
      overflow: hidden;
      color-scheme: var(--color-scheme);
      background: var(--color-background);
      color: var(--color-text);
      font-family: var(--font-family);
      font-size: var(--size-body);
      font-weight: var(--font-weight-body);
      line-height: var(--line-height-body);
      font-variant-numeric: var(--font-numeric);
    }

    * {
      box-sizing: border-box;
      margin: var(--space-0);
      padding: var(--space-0);
    }

    .board {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: var(--layout-full);
      height: var(--layout-full);
      padding: var(--board-pad-y) var(--board-pad-x);
    }

    .row {
      display: flex;
      align-items: baseline;
      column-gap: var(--gap-inline);
      min-width: var(--layout-min-width);
      white-space: nowrap;
    }

    .cost {
      display: flex;
      align-items: end;
      column-gap: var(--gap-inline);
    }

    .cost__value {
      flex: var(--layout-fixed);
      font-size: var(--size-cost);
      font-weight: var(--font-weight-cost);
      line-height: var(--line-height-cost);
    }

    .cost__rule {
      flex: var(--layout-cost-rule-fraction);
      min-width: var(--layout-min-width);
      color: var(--color-label);
    }

    .goals {
      display: flex;
      flex-direction: column;
      row-gap: var(--gap-row);
    }

    .goal {
      display: grid;
      grid-template-columns: var(--layout-goal-columns);
      column-gap: var(--gap-inline);
      align-items: baseline;
    }

    .goal > * {
      min-width: var(--layout-min-width);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .goal__projected {
      font-size: var(--size-key);
      font-weight: var(--font-weight-key);
      line-height: var(--line-height-key);
    }

    .label {
      color: var(--color-label);
      font-weight: var(--font-weight-label);
    }

    .weekly {
      height: var(--weekly-height);
      overflow: hidden;
    }

    .weekly__text {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: var(--weekly-lines);
      overflow: hidden;
    }

    .weekly__text[hidden] {
      display: none;
    }

    .weekly:has(> [hidden]) {
      height: var(--space-0);
    }

    .footer__error {
      flex: var(--layout-grow);
      min-width: var(--layout-min-width);
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--color-error);
    }

    [data-tone="slipped"] {
      color: var(--color-slipped);
    }

    [data-tone="never"] {
      color: var(--color-never);
    }

    [data-tone="closer"] {
      color: var(--color-closer);
    }

    [data-tone="unchanged"] {
      color: var(--color-unchanged);
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="board">
    <section class="cost">
      <span class="cost__value" data-bind="cost.cumulative"></span>
      <span class="cost__rule" data-bind="cost.accrualRule"></span>
    </section>

    <section class="goals">
      <div class="goal">
        <span class="label" data-bind="label.brother"></span>
        <span class="goal__projected" data-bind="goal.brother.projected"></span>
        <span data-bind="goal.brother.plan"></span>
        <span data-bind="goal.brother.driftPlan"></span>
        <span data-bind="goal.brother.driftMonday"></span>
      </div>
      <div class="goal">
        <span class="label" data-bind="label.india_house"></span>
        <span class="goal__projected" data-bind="goal.india_house.projected"></span>
        <span data-bind="goal.india_house.plan"></span>
        <span data-bind="goal.india_house.driftPlan"></span>
        <span data-bind="goal.india_house.driftMonday"></span>
      </div>
      <div class="goal">
        <span class="label" data-bind="label.marriage"></span>
        <span class="goal__projected" data-bind="goal.marriage.projected"></span>
        <span data-bind="goal.marriage.plan"></span>
        <span data-bind="goal.marriage.driftPlan"></span>
        <span data-bind="goal.marriage.driftMonday"></span>
      </div>
      <div class="goal">
        <span class="label" data-bind="label.us_house"></span>
        <span class="goal__projected" data-bind="goal.us_house.projected"></span>
        <span data-bind="goal.us_house.plan"></span>
        <span data-bind="goal.us_house.driftPlan"></span>
        <span data-bind="goal.us_house.driftMonday"></span>
      </div>
      <div class="goal">
        <span class="label" data-bind="label.partner"></span>
        <span class="goal__projected" data-bind="goal.partner.projected"></span>
        <span data-bind="goal.partner.plan"></span>
        <span data-bind="goal.partner.driftPlan"></span>
        <span data-bind="goal.partner.driftMonday"></span>
      </div>
    </section>

    <section class="row">
      <span data-bind="drift.sinceInstall"></span>
    </section>

    <section>
      <div class="row">
        <span data-bind="french.banked"></span>
        <span class="label" data-bind="label.frenchTotal"></span>
        <span class="label" data-bind="label.nclc7"></span>
        <span data-bind="french.nclc7"></span>
      </div>
      <div class="row">
        <span class="label" data-bind="label.landing"></span>
        <span data-bind="french.landing"></span>
        <span class="label" data-bind="french.basis"></span>
      </div>
    </section>

    <section class="weekly">
      <p class="weekly__text" data-bind="weekly.summary"></p>
    </section>

    <footer class="row">
      <span class="label" data-bind="label.year30"></span>
      <span data-bind="footer.year30"></span>
      <span class="footer__error" data-bind="status.error"></span>
    </footer>
  </main>

  <audio preload="auto"></audio>

  <script src="https://zraumtpmrmzegusjeeyw.supabase.co/functions/v1/dashboard/config.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
